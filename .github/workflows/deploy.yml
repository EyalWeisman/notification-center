name: Deploy MFEs

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: development

jobs:
  deploy:
    name: Deploy MFEs
    runs-on: ubuntu-latest
    if: false # Disabled until deployment infrastructure is configured
    steps:
      - run: echo "Deployment not configured yet"
